[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/runtime",
    "services/matching",
    "services/push",
    "services/ride",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
carfleet-proto = { path = "crates/proto" }
carfleet-runtime = { path = "crates/runtime" }

prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
codegen-units = 1
lto = "thin"
